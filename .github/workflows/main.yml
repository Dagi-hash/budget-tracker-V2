name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Prepare web files and icons
        run: |
          mkdir -p www
          python icons.py
          cp index.html app.js styles.css www/

      - name: Install npm packages
        run: npm install

      - name: Copy Inter font
        run: |
          mkdir -p www/fonts
          find node_modules/@fontsource/inter/files -name 'inter-latin-*-normal.woff2' -exec cp {} www/fonts/ \; || true

      - name: Add Android
        run: npx cap add android

      - name: Apply native setup
        run: python native.py

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BudgetTracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
